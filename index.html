<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    // --- ¡PON AQUÍ TUS DATOS PÚBLICOS DE SUPABASE! ---
    const SUPABASE_URL = "https://urpjnmbhhbzeirktpzcv.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVycGpubWJoaGJ6ZWlya3RwemN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NDU3NDQsImV4cCI6MjA5NTIyMTc0NH0.-DFxwerywoeoiOPzErn2PVCCosTKjuUMIVBBdXQ_RNE";
    // --------------------------------------------------

    let estadoApp = {
      nomina: 1800,
      saldo_visa: 0, 
      historial_visa: [],
      historial_meses: [], 
      gastos_fijos: [
        { id: "1", nombre: "Alquiler/Hipoteca", valor: 550 },
        { id: "2", nombre: "Recibo de la Luz", valor: 85 },
        { id: "3", nombre: "Agua y Basura", valor: 35 },
        { id: "4", nombre: "Internet y Móvil", valor: 45 }
      ],
      contador_fijos: 5
    };

    // NUEVO: Candado de seguridad para no machacar datos sin conexión
    let conexionNubeActiva = false;

    window.onload = async () => {
      document.getElementById('manual-fecha').valueAsDate = new Date();
      const fechaHoyFormateada = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
      document.getElementById('fecha-hoy').innerText = fechaHoyFormateada; 
      
      await cargarDesdeNube();
    };

    function textoSeguro(texto) {
      const div = document.createElement('div');
      div.textContent = texto;
      return div.innerHTML;
    }

    function esGastoPendiente(p_fecha_cargo, p_fecha_compra) {
      if (!p_fecha_cargo) return false;
      
      let fParts = p_fecha_cargo.split('/');
      let diaCargo = parseInt(fParts[0], 10);
      let mesCargo = parseInt(fParts[1], 10);
      
      let hoy = new Date();
      hoy.setHours(0, 0, 0, 0);
      let anioCargo = hoy.getFullYear();

      if (p_fecha_compra && p_fecha_compra.includes('/')) {
        let cParts = p_fecha_compra.split('/');
        let mesCompra = parseInt(cParts[1], 10);
        
        if (mesCompra > mesCargo) {
          if (hoy.getMonth() + 1 === mesCompra) {
            anioCargo = hoy.getFullYear() + 1;
          }
        } else {
          if (hoy.getMonth() + 1 === 1 && mesCompra === 12) {
            anioCargo = hoy.getFullYear() - 1;
          }
        }
      } else if (hoy.getMonth() === 11 && mesCargo === 1) {
        anioCargo = hoy.getFullYear() + 1;
      }

      let fDate = new Date(anioCargo, mesCargo - 1, diaCargo);
      return fDate > hoy;
    }

    function obtenerIcono(nombre) {
      const n = nombre.toLowerCase();
      if (n.includes('mercadona') || n.includes('carrefour') || n.includes('aldi') || n.includes('lidl') || n.includes('cash') || n.includes('super')) return '🛒';
      if (n.includes('repsol') || n.includes('cepsa') || n.includes('gasolina') || n.includes('glp') || n.includes('bp') || n.includes('shell')) return '⛽';
      if (n.includes('farmacia') || n.includes('salud') || n.includes('medico')) return '💊';
      if (n.includes('luz') || n.includes('endesa') || n.includes('iberdrola') || n.includes('energia')) return '💡';
      if (n.includes('agua') || n.includes('emasesa')) return '💧';
      if (n.includes('internet') || n.includes('movil') || n.includes('vodafone') || n.includes('orange') || n.includes('movistar') || n.includes('digi')) return '📱';
      if (n.includes('coche') || n.includes('seguro') || n.includes('taller') || n.includes('dacia') || n.includes('jogger')) return '🚗';
      if (n.includes('netflix') || n.includes('spotify') || n.includes('cine') || n.includes('prime')) return '🍿';
      if (n.includes('amazon') || n.includes('aliexpress') || n.includes('compra')) return '📦';
      if (n.includes('hipoteca') || n.includes('alquiler') || n.includes('casa')) return '🏠';
      return '🧾';
    }

    async function cargarDesdeNube() {
      try {
        const url = `${SUPABASE_URL}/rest/v1/memoria_app?id=eq.1`;
        const resp = await fetch(url, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        
        if (!resp.ok) throw new Error("Fallo en la respuesta");
        
        const data = await resp.json();
        
        if (data && data.length > 0 && data[0].contenido) {
           let nube = data[0].contenido;
           estadoApp.nomina = nube.nomina !== undefined ? nube.nomina : estadoApp.nomina;
           estadoApp.historial_visa = nube.historial_visa || estadoApp.historial_visa;
           estadoApp.historial_meses = nube.historial_meses || estadoApp.historial_meses; 
           
           if (nube.gastos_fijos) {
             estadoApp.gastos_fijos = nube.gastos_fijos;
             estadoApp.contador_fijos = nube.contador_fijos || 5;
           }
        } else {
           // Primer uso real
           guardarEnNube(); 
        }
        
        conexionNubeActiva = true;
        document.getElementById('estado-nube').innerText = "☁️ Sincronizado";
        document.getElementById('estado-nube').classList.replace('text-orange-500', 'text-green-500');
        dibujarInterfaz();
      } catch (error) {
        console.error("Modo sin conexión", error);
        conexionNubeActiva = false;
        document.getElementById('estado-nube').innerText = "⚠️ Sin internet (Modo Lectura)";
        document.getElementById('estado-nube').classList.replace('text-green-500', 'text-orange-500');
        dibujarInterfaz(); 
      }
    }

    async function guardarEnNube() {
      if (!conexionNubeActiva) {
        alert("⚠️ Estás sin conexión. Por seguridad, no se pueden guardar cambios hasta que vuelva internet para no perder tus datos.");
        return;
      }

      try {
        document.getElementById('estado-nube').innerText = "🔄 Sincronizando...";
        const url = `${SUPABASE_URL}/rest/v1/memoria_app?id=eq.1`;
        await fetch(url, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({ contenido: estadoApp })
        });
        setTimeout(() => { document.getElementById('estado-nube').innerText = "☁️ Sincronizado"; }, 1000);
      } catch (error) {
        console.error("Error al guardar en la nube", error);
      }
    }

    function dibujarInterfaz() {
      document.getElementById('nomina').value = estadoApp.nomina;
      
      const contenedorFijos = document.getElementById('lista-gastos-fijos');
      contenedorFijos.innerHTML = ''; 
      
      estadoApp.gastos_fijos.forEach(gasto => {
        const nombreProtegido = textoSeguro(gasto.nombre);
        
        let html = `
        <div class="flex justify-between items-center border-b pb-3 border-gray-100 pt-2">
          <span class="text-sm font-semibold text-gray-700 truncate flex-1 pr-2">${obtenerIcono(gasto.nombre)} ${nombreProtegido}</span>
          <div class="flex items-center gap-2">
            <div class="flex items-center gap-1 bg-gray-100 px-2 py-1.5 rounded-lg border border-gray-200 shadow-inner">
              <input type="number" id="caja-gasto-${gasto.id}" step="0.01" value="${gasto.valor}" 
                     class="w-14 bg-transparent text-right outline-none text-gray-800 font-bold text-base" 
                     oninput="recalcularTotal()" 
                     onchange="guardarGasto('${gasto.id}', this.value)">
              <span class="text-gray-400 font-bold text-sm">€</span>
            </div>
            <button onclick="borrarGasto('${gasto.id}')" class="text-red-300 hover:text-red-500 bg-red-50 rounded-md p-1.5 transition-colors shadow-sm">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
          </div>
        </div>`;
        contenedorFijos.insertAdjacentHTML('beforeend', html);
      });

      const listaVisa = document.getElementById('lista-movimientos-visa');
      if (estadoApp.historial_visa && estadoApp.historial_visa.length > 0) {
        listaVisa.innerHTML = '<h4 class="text-[10px] font-bold text-gray-400 uppercase mb-2 tracking-wider">Últimos Tickets</h4>';
        estadoApp.historial_visa.forEach(idGasto => {
           let p_fecha, p_comercio, p_precio, p_fecha_cargo;
           
           if (idGasto.includes('|')) {
               const partes = idGasto.split('|');
               p_fecha = partes[0]; 
               p_comercio = partes[1]; 
               p_precio = partes[2];
               p_fecha_cargo = partes[3]; 
           } else {
               const partes = idGasto.split('-');
               p_fecha = partes[0];
               p_precio = partes[partes.length - 1]; 
               p_comercio = partes.slice(1, partes.length - 1).join('-'); 
           }

           if (p_precio !== undefined) {
              const icono = obtenerIcono(p_comercio);
              const comercioProtegido = textoSeguro(p_comercio.toUpperCase());
              const fechaProtegida = textoSeguro(p_fecha);
              
              let esPendiente = esGastoPendiente(p_fecha_cargo, p_fecha);

              if (esPendiente) {
                  listaVisa.innerHTML += `
                    <div class="flex justify-between items-center text-xs py-1.5 border-b border-orange-200 last:border-0 group bg-orange-50/50 px-2 rounded">
                      <div class="flex flex-col flex-1 pr-2 overflow-hidden">
                          <span class="text-gray-500 font-medium truncate">${icono} ${fechaProtegida} - ${comercioProtegido}</span>
                          <span class="text-[9px] text-orange-600 font-bold tracking-wide mt-0.5">⏳ Se cargará el ${p_fecha_cargo}</span>
                      </div>
                      <div class="flex items-center gap-2">
                        <span class="font-bold text-orange-400 whitespace-nowrap">-${p_precio} €</span>
                        <button onclick="forzarCobro('${idGasto}')" class="text-emerald-500 bg-emerald-100 hover:bg-emerald-200 rounded px-1.5 py-0.5 transition-colors shadow-sm" title="Cobrar YA">✅</button>
                        <button onclick="borrarTicketVisa('${idGasto}')" class="text-gray-300 hover:text-red-500 transition-colors p-1" title="Borrar">
                          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                      </div>
                    </div>`;
              } else {
                  listaVisa.innerHTML += `
                    <div class="flex justify-between items-center text-xs py-1.5 border-b border-gray-100 last:border-0 group px-1">
                      <span class="text-gray-700 font-medium truncate pr-2 flex-1">${icono} ${fechaProtegida} - ${comercioProtegido}</span>
                      <div class="flex items-center gap-1.5">
                        <span class="font-bold text-red-500 whitespace-nowrap">-${p_precio} €</span>
                        <button onclick="borrarTicketVisa('${idGasto}')" class="text-gray-300 hover:text-red-500 transition-colors p-1" title="Borrar ticket">
                          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                      </div>
                    </div>`;
              }
           }
        });
      } else {
        listaVisa.innerHTML = '<p class="text-xs text-gray-400 text-center py-2 italic">Aún no hay tickets este mes</p>';
      }

      const listaMeses = document.getElementById('lista-meses-pasados');
      if (estadoApp.historial_meses && estadoApp.historial_meses.length > 0) {
        listaMeses.innerHTML = '';
        [...estadoApp.historial_meses].reverse().forEach((mes, indiceReverso) => {
          const indiceOriginal = estadoApp.historial_meses.length - 1 - indiceReverso;
          listaMeses.innerHTML += `
            <div class="flex items-center bg-gray-50/50 p-3 rounded-xl border border-gray-100 group">
              <div class="flex-1">
                <p class="text-xs font-bold text-gray-700">${mes.fecha}</p>
                <p class="text-xs mt-0.5">Sobrante: <span class="font-bold text-emerald-600">${mes.sobrante}</span></p>
              </div>
              <div class="text-right text-[10px] text-gray-400 leading-tight mr-3">
                Ingreso: ${mes.ingresos}<br>Fijos: -${mes.fijos}<br>Visa: -${mes.tarjetas}
              </div>
              <button onclick="borrarMesGuardado(${indiceOriginal})" class="text-red-300 hover:text-red-500 bg-red-50 rounded-md p-1.5 transition-colors shadow-sm" title="Borrar mes">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              </button>
            </div>`;
        });
      } else {
        listaMeses.innerHTML = '<p class="text-xs text-gray-400 text-center py-2 italic">No hay meses cerrados todavía</p>';
      }
      
      recalcularTotal();
    }

    function forzarCobro(idGasto) {
      if (confirm("¿Marcar como pagado YA? El dinero se restará de tu saldo disponible inmediatamente.")) {
        let indice = estadoApp.historial_visa.indexOf(idGasto);
        if (indice !== -1) {
           let partes = idGasto.split('|');
           let nuevoId = `${partes[0]}|${partes[1]}|${partes[2]}`;
           estadoApp.historial_visa[indice] = nuevoId;
           
           guardarEnNube();
           dibujarInterfaz();
        }
      }
    }

    function borrarMesGuardado(indice) {
      if (confirm("¿Estás seguro de que quieres borrar este mes del historial?")) {
        estadoApp.historial_meses.splice(indice, 1);
        guardarEnNube();
        dibujarInterfaz();
      }
    }

    function borrarTicketVisa(idGasto) {
      if (confirm("¿Seguro que quieres borrar este ticket?")) {
        estadoApp.historial_visa = estadoApp.historial_visa.filter(id => id !== idGasto);
        guardarEnNube();
        dibujarInterfaz();
      }
    }

    function guardarGasto(id, valor) {
      let gasto = estadoApp.gastos_fijos.find(g => g.id === id);
      if (gasto) {
        gasto.valor = Number(valor);
        guardarEnNube();
      }
    }

    function borrarGasto(id) {
      if (confirm("¿Estás seguro de que quieres borrar este gasto? Esta acción no se puede deshacer.")) {
        estadoApp.gastos_fijos = estadoApp.gastos_fijos.filter(g => g.id !== id);
        guardarEnNube(); 
        dibujarInterfaz(); 
      }
    }

    function guardarNomina(valor) {
      estadoApp.nomina = Number(valor);
      guardarEnNube();
      recalcularTotal();
    }
    
    function recalcularTotal() {
       let nominaValor = Number(document.getElementById('nomina').value) || 0;
       let fijosValor = 0;
       
       estadoApp.gastos_fijos.forEach(g => { 
          let caja = document.getElementById('caja-gasto-' + g.id);
          fijosValor += Number(caja ? caja.value : g.valor);
       });
       
       let sumaVisaReal = 0;
       estadoApp.historial_visa.forEach(idGasto => {
            let partes = idGasto.includes('|') ? idGasto.split('|') : idGasto.split('-');
            let p_precio = Number(idGasto.includes('|') ? partes[2] : partes[partes.length - 1]);
            
            let p_fecha = partes[0];
            let p_fecha_cargo = idGasto.includes('|') ? partes[3] : undefined;
            let esPendiente = esGastoPendiente(p_fecha_cargo, p_fecha);

            if (!esPendiente) {
                sumaVisaReal += p_precio;
            }
       });

       estadoApp.saldo_visa = sumaVisaReal; 
       
       const formatoEuro = (numero) => numero.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";

       document.getElementById('total-ingreso').innerText = formatoEuro(nominaValor);
       document.getElementById('total-fijos').innerText = formatoEuro(fijosValor);
       
       document.getElementById('total-tarjetas').innerText = formatoEuro(estadoApp.saldo_visa);
       document.getElementById('gasto-visa').innerText = formatoEuro(estadoApp.saldo_visa);

       let saldo = nominaValor - fijosValor - estadoApp.saldo_visa;
       document.getElementById('saldo-total').innerText = formatoEuro(saldo);

       let tarjeta = document.getElementById('tarjeta-saldo');
       tarjeta.classList.remove('bg-emerald-500', 'bg-orange-500', 'bg-red-500');

       if (saldo < 300) {
           tarjeta.classList.add('bg-red-500'); 
       } else if (saldo < 500) {
           tarjeta.classList.add('bg-orange-500'); 
       } else {
           tarjeta.classList.add('bg-emerald-500'); 
       }
    }

    const ventanaModal = document.getElementById('ventana-nuevo-gasto');
    const inputNuevoNombre = document.getElementById('input-nombre-gasto');

    function abrirVentanaGasto() {
      inputNuevoNombre.value = ''; 
      ventanaModal.classList.replace('modal-oculto', 'modal-visible');
    }

    function cerrarVentanaGasto() {
      ventanaModal.classList.replace('modal-visible', 'modal-oculto');
    }

    function confirmarNuevoGasto() {
      let nombre = inputNuevoNombre.value.trim();
      if (!nombre) return;

      estadoApp.gastos_fijos.push({
        id: estadoApp.contador_fijos.toString(),
        nombre: nombre,
        valor: 0
      });
      estadoApp.contador_fijos++;
      
      cerrarVentanaGasto();
      guardarEnNube();
      dibujarInterfaz();
    }

    function empezarMesNuevo() {
      if(confirm("¿Seguro que quieres cerrar el periodo? Se borrarán los tickets ya cobrados, pero se mantendrán los pendientes (en naranja) para el nuevo mes.")) {
        
        let totalIngreso = document.getElementById('total-ingreso').innerText;
        let totalFijos = document.getElementById('total-fijos').innerText;
        let totalTarjetas = document.getElementById('total-tarjetas').innerText;
        let saldoRestante = document.getElementById('saldo-total').innerText;
        
        let fechaCierre = new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });

        estadoApp.historial_meses.push({
          fecha: fechaCierre,
          ingresos: totalIngreso,
          fijos: totalFijos,
          tarjetas: totalTarjetas,
          sobrante: saldoRestante
        });

        let textoWhatsApp = `📊 *CIERRE DE CUENTAS - PRESUFÁCIL*\n📅 Fecha: ${fechaCierre}\n\n💰 Ingresos: ${totalIngreso}\n🏠 Gastos Fijos: ${totalFijos}\n💳 Tarjeta: ${totalTarjetas}\n------------------------\n✅ *SALDO SOBRANTE: ${saldoRestante}*\n\n¡Periodo cerrado y reseteado! 🐷`;
        let urlWhatsApp = `https://api.whatsapp.com/send?text=${encodeURIComponent(textoWhatsApp)}`;

        if(confirm("Resumen guardado en la App. ¿Quieres enviarlo también por WhatsApp?")) {
          window.open(urlWhatsApp, '_blank');
        }

        estadoApp.historial_visa = estadoApp.historial_visa.filter(idGasto => {
          if (!idGasto.includes('|')) return false;
          let partes = idGasto.split('|');
          let p_fecha = partes[0];
          let p_fecha_cargo = partes[3];
          return esGastoPendiente(p_fecha_cargo, p_fecha);
        });

        guardarEnNube();
        dibujarInterfaz();
        
        if (estadoApp.historial_visa.length > 0) {
          alert(`¡Mes reiniciado con éxito! Se han conservado ${estadoApp.historial_visa.length} gasto(s) pendiente(s) de cargo para este nuevo mes.`);
        } else {
          alert("¡Mes reiniciado con éxito!");
        }
      }
    }

    function añadirGastoManual() {
      if (!conexionNubeActiva) {
        alert("⚠️ No puedes añadir gastos sin conexión.");
        return;
      }
      
      const comercio = document.getElementById('manual-comercio').value.trim();
      let precioString = document.getElementById('manual-precio').value.replace(',', '.');
      const precio = Math.abs(Number(precioString) || 0);
      const fechaInput = document.getElementById('manual-fecha').value; 
      
      const fechaCargoInput = document.getElementById('manual-fecha-cargo').value;

      if (!comercio || precio === 0 || !fechaInput) {
        alert("Por favor, rellena el lugar, el precio y la fecha correcta.");
        return;
      }

      const partesFecha = fechaInput.split('-');
      const fechaFormateada = `${partesFecha[2]}/${partesFecha[1]}`;
      
      let fechaCargoFormateada = "";
      if (fechaCargoInput) {
          const partesCargo = fechaCargoInput.split('-');
          fechaCargoFormateada = `${partesCargo[2]}/${partesCargo[1]}`;
      }

      // NUEVO: Borramos los símbolos | para que no rompan el sistema
      const comercioDNI = comercio.replace(/\s+/g, '').replace(/\|/g, '').toLowerCase();
      
      // NUEVO: El núcleo central para detectar duplicados reales (fecha + tienda + precio)
      const coreID = `${fechaFormateada}|${comercioDNI}|${precio}`;
      const idGastoInterno = fechaCargoFormateada ? `${coreID}|${fechaCargoFormateada}` : coreID;

      // Buscamos si existe ya un gasto guardado que empiece exactamente igual
      const yaExiste = estadoApp.historial_visa.some(idGuardado => idGuardado.startsWith(coreID));

      if (yaExiste) {
        alert(`⚠️ ¡Cuidado! El gasto de ${precio}€ en ${comercio} ya estaba guardado en la memoria (es un duplicado).`);
      } else {
        estadoApp.historial_visa.push(idGastoInterno);
        
        guardarEnNube();
        dibujarInterfaz();
        
        document.getElementById('manual-comercio').value = '';
        document.getElementById('manual-precio').value = '';
        document.getElementById('manual-fecha-cargo').value = ''; 
        
        alert(`✅ Gasto guardado con éxito.`);
      }
    }

    const btnFoto = document.getElementById('btn-foto');
    const inputFoto = document.getElementById('input-foto');
    
    btnFoto.addEventListener('click', () => {
      if (!conexionNubeActiva) {
        alert("⚠️ No puedes subir fotos sin conexión a internet.");
        return;
      }
      inputFoto.click();
    });

    inputFoto.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      btnFoto.innerHTML = "⏳ Leyendo e identificando...";
      btnFoto.classList.replace('bg-blue-600', 'bg-gray-500');

      try {
        const base64Image = await convertirABase64(file);
        const urlFuncion = `${SUPABASE_URL}/functions/v1/leer-ticket`;
        
        const respuesta = await fetch(urlFuncion, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({ imagen: base64Image })
        });

        const gastos = await respuesta.json();
        if (gastos.error) {
          alert("⚠️ ERROR GEMINI:\n" + gastos.error);
          return; 
        }

        let listaGastos = Array.isArray(gastos) ? gastos : (gastos.gastos || []);

        if (listaGastos.length > 0) {
          let gastosAceptados = 0;
          let gastosIgnorados = 0;
          let mensaje = "Resultado de la lectura:\n\n";
          
          listaGastos.forEach(gasto => {
            let importeLimpio = String(gasto.importe).replace(',', '.');
            let importeNumero = Math.abs(Number(importeLimpio) || 0); 
            
            const fechaDNI = String(gasto.fecha).trim();
            
            // NUEVO: Borramos los símbolos | para que no rompan el sistema
            const comercioDNI = String(gasto.comercio).replace(/\s+/g, '').replace(/\|/g, '').toLowerCase();
            
            let p_fecha_cargo = "";
            if (gasto.fecha_cargo) {
                p_fecha_cargo = String(gasto.fecha_cargo).trim();
            }

            // NUEVO: Comprobación por núcleo (coreID) ignora si el banco quitó "Se cargará el..."
            const coreID = `${fechaDNI}|${comercioDNI}|${importeNumero}`;
            const idGastoInterno = p_fecha_cargo ? `${coreID}|${p_fecha_cargo}` : coreID;

            const yaExiste = estadoApp.historial_visa.some(idGuardado => idGuardado.startsWith(coreID));

            if (yaExiste) {
              gastosIgnorados++; 
            } else {
              estadoApp.historial_visa.push(idGastoInterno);
              gastosAceptados++;
              mensaje += `✅ Nuevo: ${obtenerIcono(gasto.comercio)} ${gasto.fecha} | ${gasto.comercio} | ${importeNumero.toFixed(2)} €\n`;
            }
          });

          if (gastosAceptados > 0) {
            guardarEnNube(); 
            dibujarInterfaz();
          }
          
          mensaje += `\nResumen: ${gastosAceptados} nuevos añadidos, ${gastosIgnorados} repetidos ignorados.\n`;
          alert(mensaje);

        } else {
          alert("Gemini no ha detectado ningún gasto válido.");
        }
      } catch (error) {
        alert("Hubo un error de conexión.");
      } finally {
        btnFoto.innerHTML = "📸 Subir Captura de Tarjeta";
        btnFoto.classList.replace('bg-gray-500', 'bg-blue-600');
        inputFoto.value = "";
      }
    });

    function convertirABase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (evento) => {
          const img = new Image();
          
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            
            const MAX_AREA = 1500000;
            const area = width * height;
            
            if (area > MAX_AREA) {
              const ratio = Math.sqrt(MAX_AREA / area);
              width = Math.round(width * ratio);
              height = Math.round(height * ratio);
            }
            
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            
            resolve(canvas.toDataURL('image/jpeg', 0.8).split(',')[1]);
          };
          
          img.onerror = error => reject(error);
          img.src = evento.target.result;
        };
        reader.onerror = error => reject(error);
      });
    }
  </script>
